<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#F6F3FC">
  <meta name="format-detection" content="telephone=no">
  <title>Cadence</title>
  <link rel="stylesheet" href="style.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      var t = 'system';
      try { var s = JSON.parse(localStorage.getItem('cadence.v1.settings') || '{}'); if (s.general && s.general.theme) t = s.general.theme; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <!-- Icon sprite -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1" fill="currentColor"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6v12l8.5-6zM16.5 6h2v12h-2z" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6v12l-8.5-6zM5.5 6h2v12h-2z" fill="currentColor"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 6l7 6-7 6zM13 6l7 6-7 6z" fill="currentColor"/></symbol>

    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9-9.3C2 7.4 4.3 4.5 7.4 4.5c1.9 0 3.4 1 4.6 2.6 1.2-1.6 2.7-2.6 4.6-2.6 3.1 0 5.4 2.9 4.4 6.2-1.5 4.7-9 9.3-9 9.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9-9.3C2 7.4 4.3 4.5 7.4 4.5c1.9 0 3.4 1 4.6 2.6 1.2-1.6 2.7-2.6 4.6-2.6 3.1 0 5.4 2.9 4.4 6.2-1.5 4.7-9 9.3-9 9.3z" fill="currentColor"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>

    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.8 7-6.8 0-4.2-3.5-6.4-4.5-10.2-2.3 1.6-3 3.8-3 5.5-1.4-.7-2.2-2.2-2.3-3.5C6.9 9.2 5 11.7 5 15.2 5 19.2 8 22 12 22z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 4 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>

    <symbol id="i-apps" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2" fill="currentColor"/><circle cx="12" cy="6" r="2" fill="currentColor"/><circle cx="18" cy="6" r="2" fill="currentColor"/><circle cx="6" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="18" cy="12" r="2" fill="currentColor"/><circle cx="6" cy="18" r="2" fill="currentColor"/><circle cx="12" cy="18" r="2" fill="currentColor"/><circle cx="18" cy="18" r="2" fill="currentColor"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M10 7H6a2 2 0 0 0-2 2v4h5v5H4M20 7h-4a2 2 0 0 0-2 2v4h5v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5a3 3 0 0 0 3.5 4M16 6h3.5a3 3 0 0 1-3.5 4M12 13v4M8.5 20h7M10 17h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  </svg>

  <div class="app" id="app">
    <!-- Navigation: bottom bar on mobile, sidebar on desktop -->
    <nav class="nav" id="nav" aria-label="Main navigation">
      <button class="nav-item" data-screen="home" aria-label="Home"><span class="nav-pill"><svg><use href="#i-home"/></svg></span><span>Home</span></button>
      <button class="nav-item" data-screen="tasks" aria-label="Tasks"><span class="nav-pill"><svg><use href="#i-tasks"/></svg></span><span>Tasks</span></button>
      <button class="nav-item" data-screen="calendar" aria-label="Calendar"><span class="nav-pill"><svg><use href="#i-cal"/></svg></span><span>Calendar</span></button>
      <button class="nav-item" data-screen="focus" aria-label="Focus"><span class="nav-pill"><svg><use href="#i-focus"/></svg></span><span>Focus</span></button>
      <button class="nav-item" data-screen="settings" aria-label="Settings"><span class="nav-pill"><svg><use href="#i-settings"/></svg></span><span>Settings</span></button>
    </nav>

    <main class="main" id="main">
      <!-- Top bar (shared) -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="backBtn" aria-label="Back" hidden><svg><use href="#i-left"/></svg></button>
          <div class="topbar-title" id="topbarTitle">Home</div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="topInsightsBtn" aria-label="Open insights" title="Insights"><svg><use href="#i-stats"/></svg></button>
          <button class="icon-btn" id="bellBtn" aria-label="Notifications" title="Notifications"><svg><use href="#i-bell"/></svg><span class="badge" id="bellBadge" hidden>0</span></button>
        </div>
      </header>

      <!-- HOME -->
      <section class="screen" id="screen-home" data-title="Home">
        <div class="hero">
          <div>
            <p class="eyebrow" id="heroDate"></p>
            <h1 class="hero-greet" id="heroGreet">Hello</h1>
            <p class="hero-sub" id="heroSummary"></p>
          </div>
          <div class="quick-actions">
            <button class="btn btn-primary" id="qaNewTask"><svg><use href="#i-plus"/></svg>New task</button>
            <button class="btn btn-soft" id="qaFocus"><svg><use href="#i-focus"/></svg>Start focus</button>
            <button class="btn btn-soft" id="qaCalendar"><svg><use href="#i-cal"/></svg>Calendar</button>
          </div>
        </div>
        <div id="homePerm"></div>
        <div class="summary-row" id="summaryRow"></div>
        <div class="active-card" id="activeCard"></div>
        <div class="widgets-head">
          <h2 class="section-title">Your widgets</h2>
          <button class="btn btn-ghost btn-sm" id="customizeBtn"><svg><use href="#i-sliders"/></svg>Customize</button>
        </div>
        <div class="widget-grid" id="widgetGrid"></div>
      </section>

      <!-- TASKS -->
      <section class="screen" id="screen-tasks" data-title="Tasks" hidden>
        <div class="screen-head">
          <div class="search-box">
            <svg><use href="#i-search"/></svg>
            <input type="search" id="taskSearch" placeholder="Search tasks" aria-label="Search tasks">
          </div>
          <button class="btn btn-ghost" id="filtersToggle" aria-expanded="false" aria-controls="taskFilters" aria-label="Filters and sorting"><svg><use href="#i-sliders"/></svg></button>
        </div>
        <div class="seg" id="taskViews" role="tablist" aria-label="Task views">
          <button data-view="all" role="tab">All</button>
          <button data-view="today" role="tab">Today</button>
          <button data-view="upcoming" role="tab">Upcoming</button>
          <button data-view="overdue" role="tab">Overdue</button>
          <button data-view="completed" role="tab">Completed</button>
        </div>
        <div class="filters" id="taskFilters" hidden>
          <label class="mini-select"><span>Priority</span>
            <select id="fPriority"><option value="">Any</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>
          <label class="mini-select"><span>Category</span><select id="fCategory"><option value="">Any</option></select></label>
          <label class="mini-select"><span>Status</span>
            <select id="fStatus"><option value="">Any</option><option value="pending">Pending</option><option value="inprogress">In progress</option><option value="completed">Completed</option></select></label>
          <label class="mini-select"><span>Sort</span>
            <select id="fSort"><option value="scheduled">Scheduled date</option><option value="due">Due date</option><option value="priority">Priority</option><option value="status">Status</option><option value="category">Category</option><option value="created">Newest</option></select></label>
        </div>
        <div class="task-list" id="taskList"></div>
      </section>

      <!-- CALENDAR -->
      <section class="screen" id="screen-calendar" data-title="Calendar" hidden>
        <div class="cal-card">
          <div class="cal-toolbar">
            <div class="cal-nav">
              <button class="cal-arrow" id="calPrev" aria-label="Previous"><svg><use href="#i-left"/></svg></button>
              <button class="cal-title" id="calTitle" aria-label="Go to today"></button>
              <button class="cal-arrow" id="calNext" aria-label="Next"><svg><use href="#i-right"/></svg></button>
            </div>
            <div class="cal-views" id="calViews" role="tablist" aria-label="Calendar view">
              <button data-cview="month" role="tab">Month</button>
              <button data-cview="week" role="tab">Week</button>
              <button data-cview="day" role="tab">Day</button>
            </div>
          </div>
          <div class="cal-body" id="calBody"></div>
        </div>
        <div class="cal-agenda" id="calAgenda"></div>
      </section>

      <!-- FOCUS -->
      <section class="screen" id="screen-focus" data-title="Focus" hidden>
        <div class="focus-layout">
          <div class="card focus-main" id="focusMain"></div>
          <div class="focus-side">
            <div class="card" id="focusDevice"></div>
            <div class="card" id="focusMusicCard"></div>
          </div>
        </div>
      </section>

      <!-- INSIGHTS -->
      <section class="screen" id="screen-insights" data-title="Insights" hidden>
        <div class="seg seg-sm" id="statRange" role="tablist" aria-label="Range">
          <button data-range="day" role="tab">Today</button>
          <button data-range="week" role="tab">This week</button>
          <button data-range="month" role="tab">This month</button>
          <button data-range="all" role="tab">All time</button>
        </div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="card insights-card" id="insightList"></div>
        <div class="chart-grid">
          <div class="card chart-card"><h3>Daily focus time</h3><p class="muted small">Last 14 days, minutes</p><div class="chart-wrap"><canvas id="chDaily"></canvas></div></div>
          <div class="card chart-card"><h3>Weekly productivity</h3><p class="muted small">Last 8 weeks</p><div class="chart-wrap"><canvas id="chWeekly"></canvas></div></div>
          <div class="card chart-card"><h3>Task completion</h3><p class="muted small">All tasks by state</p><div class="chart-wrap"><canvas id="chTasks"></canvas></div></div>
          <div class="card chart-card"><h3>Focus session history</h3><p class="muted small">Last 20 focus sessions, minutes</p><div class="chart-wrap"><canvas id="chSessions"></canvas></div></div>
          <div class="card chart-card chart-wide"><h3>Productivity trend</h3><p class="muted small">Last 30 days — focus minutes and 7-day average</p><div class="chart-wrap"><canvas id="chTrend"></canvas></div></div>
        </div>
        <div class="card" id="goalsCard"></div>
      </section>

      <!-- SETTINGS -->
      <section class="screen" id="screen-settings" data-title="Settings" hidden>
        <div class="settings" id="settingsRoot"></div>
      </section>
    </main>
  </div>

  <!-- Floating add button (Tasks & Calendar) -->
  <button class="fab" id="fab" aria-label="Add task" hidden><svg><use href="#i-plus"/></svg></button>

  <!-- Global mini player -->
  <div class="mini-player" id="miniPlayer" hidden></div>

  <!-- Notification panel -->
  <aside class="drawer" id="notifDrawer" aria-label="Notifications" hidden>
    <div class="drawer-head">
      <h2>Notifications</h2>
      <div class="drawer-actions">
        <button class="btn btn-ghost btn-sm" id="notifReadAll">Mark all read</button>
        <button class="btn btn-ghost btn-sm" id="notifClear">Clear</button>
        <button class="icon-btn" id="notifClose" aria-label="Close notifications"><svg><use href="#i-x"/></svg></button>
      </div>
    </div>
    <p class="notice-note" id="notifPermissionNote"></p>
    <div class="drawer-body" id="notifList"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Modal host -->
  <div class="modal-host" id="modalHost"></div>

  <!-- Screen break overlay -->
  <div class="eye-overlay" id="eyeOverlay" role="dialog" aria-modal="true" aria-labelledby="eyeTitle" hidden></div>

  <!-- Toasts -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="native.js"></script>
  <script src="audio.js"></script>
  <script src="script.js"></script>
</body>
